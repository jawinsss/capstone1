version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: capstone1_postgres
    environment:
      POSTGRES_DB: capstone1_db
      POSTGRES_USER: capstone1_user
      POSTGRES_PASSWORD: capstone1_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: capstone1_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@capstone1.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
