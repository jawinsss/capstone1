<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatFlow - Trang chủ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="../../styles/homepage.css">
    <link rel="shortcut icon" href="../../assets/Favicon MatFlow.png" type="image/x-icon">
    <script src="../../js/config.js" defer></script>
    <script src="../../js/apiService.js" defer></script>
    <script src="../../js/homepage.js" defer></script>
    <style>[hidden]{display:none!important}</style>
    </head>
<body>
    <div class="hp-topbar">
        <div class="hp-topbar-inner">
            <a class="hp-supplier-link" href="#">Đăng kí để trở thành nhà cung cấp</a>
            <div class="hp-top-actions">
                <button class="hp-chip" type="button"><i class="fa-solid fa-globe"></i> Tiếng việt</button>
                <span id="hpUserName" class="hp-top-hint"></span>
                <a id="hpLoginLink" href="../../index.html" class="hp-top-link">Đăng nhập</a>
                <button id="hpLogoutBtn" class="hp-top-link" hidden>Đăng xuất</button>
                <a id="hpAdminLink" href="../adminpage/admin.html" class="hp-top-link" hidden>Admin</a>
            </div>
        </div>
    </div>

    <header class="hp-header">
        <img  class="hp-logo" src="../../assets/Icon MatFlow.png" alt="MatFlow" class="hp-logo">
        <div class="hp-search">
            <input id="hpSearch" class="hp-input" placeholder="Tìm kiếm sản phẩm...">
        </div>
        <nav class="hp-nav">
            <a href="#" data-link="home" class="active">Trang Chủ</a>
            <a href="#" data-link="products">Sản Phẩm</a>
            <a href="#" data-link="contact">Liên Hệ</a>
        </nav>
        <div class="hp-user">
            <button id="hpCartBtn" class="hp-btn small" title="Giỏ hàng">🛒 <span id="hpCartCount">0</span></button>
        </div>
    </header>

    <main class="hp-main">
        <section class="hp-banner" id="hpBanner">
            <img src="../../assets/Sale.png" alt="Banner">
        </section>
        <marquee>Những Sản Phẩm Nổi Bật</marquee>
        <div class="hp-layout">
            <aside class="hp-aside">
                <h3>Danh Mục Sản Phẩm</h3>
                <ul class="cat-menu" id="catMenu"></ul>
            </aside>

            <div id="dynSections"></div>
        </div>
    </main>

    <div id="hpProductModal" class="hp-modal" hidden>
        <div class="hp-modal-body">
            <button id="closeModal" class="hp-btn small">Đóng</button>
            <h3 id="modalTitle"></h3>
            <div id="modalPrice"></div>
            <p id="modalDesc"></p>
            <div class="hp-row">
                <input id="qtyInput" type="number" min="1" value="1" class="hp-input small">
                <button id="addToCart" class="hp-btn primary">Thêm vào giỏ</button>
            </div>
            <div>
                <h4>Đánh giá</h4>
                <div id="reviewList" class="hp-reviews"></div>
                <div id="reviewForm" class="hp-review-form">
                    <input id="reviewRating" type="number" min="1" max="5" value="5" class="hp-input small">
                    <input id="reviewContent" placeholder="Viết nhận xét..." class="hp-input">
                    <button id="submitReview" class="hp-btn">Gửi</button>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="hp-footer">Copyright © 2025 - Bản quyền thuộc về Công ty TNHH MatFlow</footer>
</body>
</html>
