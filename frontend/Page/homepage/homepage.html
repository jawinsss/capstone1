<!DOCTYPE html>

                <a id="hpLoginLink" href="../../index.html" class="hp-top-link">Đăng nhập</a>

                <a id="hpAdminLink" href="../adminpage/admin.html" class="hp-top-link" hidden>Admin</a>

        </div>

    <header class="hp-header">
        <div class="hp-header-container">

            <nav class="hp-nav">

                    <i class="fa-solid fa-house"></i> Trang chủ</a>
                <a href="products.html">
                    <i class="fa-solid fa-tag"></i> Sản Phẩm</a>
                <a href="#">
                    <i class="fa-solid fa-envelope"></i> Liên Hệ</a>

            </div>
        </div>

    <section id="home" data-view="home">
        <main class="hp-main">
            <div class="hp-main-container">
                <section class="hp-hero">
                    <div class="hp-hero-left">
                        <a href="#home" title="MatFlow Homepage">
                            <img src="../../assets/MatFlow homepage.png" alt="MatFlow">
                        </a>
                    </div>
                    <div class="hp-hero-right">
                        <a href="products.html" class="hp-hero-small">
                            <img src="../../assets/Sắt thép hp.png" alt="Sắt thép">
                        </a>
                        <a href="products.html" class="hp-hero-small">
                            <img src="../../assets/hóa chất hp.png" alt="Hóa chất">
                        </a>
                        <a href="products.html" class="hp-hero-small">

                <div class="hp-feature-bar">
                    <a href="../pages/chinh-sach-van-chuyen.html" class="hp-feature"><i class="fa-solid fa-truck"></i> Giao hàng toàn quốc</a>

                        <ul class="cat-menu" id="catMenu"></ul>
                    </aside>
                    <div id="dynSections"></div>

    <footer class="hp-footer">
        <div class="hp-footer-container">
            Copyright © 2025 - Bản quyền thuộc về Công ty TNHH MatFlow
